type User @table {
  displayName: String!
  email: String!
  createdAt: Timestamp!
  userType: String!
  phoneNumber: String
  address: String
}

type ProducerProfile @table {
  user: User!
  farmName: String!
  location: String!
  createdAt: Timestamp!
  description: String
  website: String
  deliveryOptions: String
}

type EggType @table {
  producer: ProducerProfile!
  eggName: String!
  pricePerDozen: Float!
  createdAt: Timestamp!
  description: String
  size: String
  color: String
}

type Inventory @table {
  producer: ProducerProfile!
  eggType: EggType!
  availableQuantity: Int!
  lastUpdatedAt: Timestamp!
}

type Order @table {
  customer: User!
  producer: ProducerProfile!
  orderDate: Timestamp!
  totalAmount: Float!
  status: String!
  pickupOrDeliveryPreference: String
  deliveryAddress: String
}

type OrderItem @table {
  order: Order!
  eggType: EggType!
  quantity: Int!
  unitPrice: Float!
}

type Review @table {
  customer: User!
  producer: ProducerProfile!
  order: Order!
  rating: Int!
  createdAt: Timestamp!
  comment: String
}